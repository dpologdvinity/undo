[package]
name = "undo-cli"
version = "0.1.1"
edition = "2024"
rust-version = "1.89"
license = "MIT"
description = "Ctrl-Z for your terminal and your AI agent"
repository = "https://github.com/dpologdvinity/undo"
homepage = "https://github.com/dpologdvinity/undo"

[[bin]]
name = "undo"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
formula = "undo"

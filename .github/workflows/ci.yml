name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Environment & Dependency Setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2.7.7

      - name: Validate dependencies and cargo check
        run: cargo check --all-targets --locked

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2.7.7

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    needs: check
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2.7.7

      - name: Verify Git environment
        run: git --version

      - name: Run test suite
        run: cargo test --all-targets --locked --verbose

  coverage:
    name: Code Coverage
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"
          components: llvm-tools-preview

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2.7.7

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.49.18
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage report
        run: cargo llvm-cov --all-targets --locked --lcov --output-path lcov.info

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.4.0
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    name: Production Artifact Build (${{ matrix.os }})
    needs: [lint, test]
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - name: Setup Rust cache
        uses: swatinem/rust-cache@v2.7.7

      - name: Build release binary
        run: cargo build --release --locked

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4.6.1
        with:
          name: undo-${{ matrix.os }}
          path: target/release/undo
          if-no-files-found: error

  distribution:
    name: Distribution Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y apt-utils gnupg
      - name: Verify signed packages and isolated apt installation
        run: python3 tests/distribution.py

  ci-status:
    name: CI Status Gate
    if: always()
    needs: [check, lint, test, coverage, build, distribution]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate pipeline status
        run: |
          if [ "${{ needs.check.result }}" != "success" ] || \
             [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.coverage.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.distribution.result }}" != "success" ]; then
            echo "CI pipeline failed"
            exit 1
          fi
          echo "CI pipeline completed successfully"
